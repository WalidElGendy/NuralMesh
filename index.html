<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daleel دليل — AI Investment Guide</title>
<meta name="description" content="DALEEL — MODON's AI investment guide. See what moving your business to Saudi Arabia's industrial cities means for your markets, costs, and growth — in minutes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%230D1B2A'/><path d='M20 44 L32 16 L44 44' stroke='%23E8C15A' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='32' cy='38' r='4' fill='%23269988'/></svg>">
<style>
:root{
  --bg0:#04080F; --bg1:#071120; --bg2:#0B1A2E;
  --card:rgba(13,27,46,.55); --card-solid:#0E1E33;
  --ink:#EDF3FA; --ink2:#A9BBD1; --muted:#68809C;
  --gold:#E8C15A; --gold-deep:#BE8926;
  --teal:#269988; --teal-bright:#39C4AE;
  --blue:#5B85DE; --rose:#C05C8D;
  --good:#3FA96F; --line:rgba(120,150,190,.16); --line2:rgba(120,150,190,.30);
  --r:18px; --shadow:0 18px 50px rgba(2,8,20,.55);
  --font-en:'Outfit',system-ui,sans-serif; --font-ar:'IBM Plex Sans Arabic',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(1200px 800px at 72% 8%, rgba(57,196,174,.10), transparent 60%),
    radial-gradient(1000px 700px at 12% 92%, rgba(91,133,222,.08), transparent 58%),
    radial-gradient(700px 500px at 92% 88%, rgba(232,193,90,.05), transparent 55%),
    linear-gradient(165deg,var(--bg0) 0%,var(--bg1) 48%,#050D1A 100%);
  color:var(--ink); font-family:var(--font-en); min-height:100vh; overflow-x:hidden;
}
html[lang="ar"] body{font-family:var(--font-ar)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 50% 0%, transparent 55%, rgba(2,6,14,.55) 100%);}
#plexus{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
header,main,footer,#chat,#chat-fab{position:relative;z-index:2}
header{position:sticky!important}
::selection{background:rgba(232,193,90,.3)}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:16px 30px;background:rgba(4,8,15,.6);backdrop-filter:blur(22px);border-bottom:1px solid rgba(130,160,200,.10)}
.logo{display:flex;align-items:center;gap:12px;user-select:none}
.logo-word{font-weight:800;font-size:25px;letter-spacing:-.035em;line-height:1;color:var(--ink)}
.logo-word .ar{font-family:var(--font-ar);font-weight:500;font-size:15px;color:var(--muted);letter-spacing:0;margin-inline-start:8px}
.logo-sub{font-size:9.5px;color:var(--ink2);letter-spacing:.34em;text-transform:uppercase;margin-top:4px;opacity:.85}
header .spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;font-size:13.5px;font-weight:600;
  border:1px solid var(--line2);color:var(--ink2);transition:.2s}
.hbtn:hover{border-color:var(--gold);color:var(--ink)}
.hbtn.active{background:rgba(232,193,90,.12);border-color:rgba(232,193,90,.5);color:var(--gold)}
.hbtn svg{flex:0 0 auto}

/* ---------- layout ---------- */
.screen{display:none;max-width:1180px;margin:0 auto;padding:34px 26px 90px;animation:fadeUp .5s ease both}
.screen.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
h1{font-size:clamp(36px,5.8vw,64px);font-weight:800;line-height:1.08;letter-spacing:-.025em;
  background:linear-gradient(150deg,#F5F9FF 30%,#9FB6D4 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1 .gold,h1 em.gold{-webkit-text-fill-color:var(--gold)}
h2{font-size:clamp(24px,3.4vw,34px);font-weight:700;line-height:1.2}
.kicker{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--teal-bright);margin-bottom:16px}
.kicker::before{content:"";width:26px;height:2px;background:var(--teal-bright);border-radius:2px}
.lead{color:var(--ink2);font-size:17px;line-height:1.75;max-width:70ch}
.gold{color:var(--gold)}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center;min-height:66vh}
.hero-map{position:relative}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin:34px 0 30px}
.stat{flex:1 1 150px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(180,205,235,.06)}
.stat b{display:block;font-size:27px;font-weight:800;color:var(--gold);letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.cta{display:inline-flex;align-items:center;gap:12px;padding:17px 34px;border-radius:999px;font-size:17px;font-weight:700;
  background:linear-gradient(120deg,var(--gold),#D9AE3F);color:#14213A;box-shadow:0 12px 34px rgba(232,193,90,.28);transition:.25s}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(232,193,90,.38)}
.cta.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2);box-shadow:none;font-weight:600;font-size:15px}
.cta.ghost:hover{border-color:var(--gold);color:var(--gold)}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ---------- journey chrome ---------- */
.progress{display:flex;gap:6px;margin:6px 0 26px;flex-wrap:wrap}
.pstep{flex:1 1 90px;min-width:90px;padding:9px 6px 11px;border-radius:12px;border:1px solid var(--line);
  background:rgba(13,27,42,.6);text-align:center;font-size:11.5px;color:var(--muted);position:relative;transition:.25s;cursor:pointer}
.pstep b{display:block;font-size:14px;margin-bottom:2px;color:var(--ink2);font-weight:700}
.pstep.done{border-color:rgba(38,153,136,.55)} .pstep.done b{color:var(--teal-bright)}
.pstep.now{border-color:rgba(232,193,90,.65);background:rgba(232,193,90,.08)} .pstep.now b{color:var(--gold)}
.chapter-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px}
.chapter-num{font-size:56px;font-weight:800;color:transparent;-webkit-text-stroke:1.5px rgba(232,193,90,.5);line-height:1;flex:0 0 auto}
.daleel-says{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin:18px 0 26px;backdrop-filter:blur(8px)}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:radial-gradient(circle at 32% 28%,#1E4A44,#0F2A33);border:1px solid rgba(57,196,174,.45);position:relative}
.avatar::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(57,196,174,.35);animation:pulse 2.6s infinite}
.daleel-says p{color:var(--ink);line-height:1.7;font-size:15.5px}
.daleel-says .who{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--teal-bright);text-transform:uppercase;margin-bottom:5px}
.navrow{display:flex;justify-content:space-between;gap:14px;margin-top:34px;flex-wrap:wrap}

/* ---------- cards & grids ---------- */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;backdrop-filter:blur(16px);transition:.25s;
  box-shadow:inset 0 1px 0 rgba(180,205,235,.06)}
.card:hover{box-shadow:inset 0 1px 0 rgba(180,205,235,.06),0 14px 40px rgba(2,8,20,.45)}
.card h3{font-size:16.5px;font-weight:700;margin-bottom:8px}
.card .sub{font-size:13px;color:var(--muted);line-height:1.6}
.pick{cursor:pointer;text-align:start;width:100%}
.pick:hover{border-color:var(--line2);transform:translateY(-2px)}
.pick.sel{border-color:rgba(232,193,90,.6);background:rgba(232,193,90,.07)}
.pick.sel h3{color:var(--gold)}
.pick .ico{font-size:26px;margin-bottom:10px;display:block;filter:grayscale(.15)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:999px;border:1px solid var(--line2);
  font-size:13.5px;color:var(--ink2);cursor:pointer;transition:.18s;user-select:none}
.chip:hover{border-color:var(--teal-bright)}
.chip.sel{background:rgba(38,153,136,.16);border-color:rgba(57,196,174,.6);color:var(--teal-bright);font-weight:600}
.chiprow{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}
.f-label{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:26px 0 4px}
.f-hint{font-size:12.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel]{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(8,17,32,.6);color:var(--ink);font-size:15px;outline:none;transition:.2s}
input:focus{border-color:rgba(232,193,90,.55)}

/* ---------- map ---------- */
.mapwrap{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;backdrop-filter:blur(8px);box-shadow:var(--shadow)}
.map-caption{display:flex;gap:16px;flex-wrap:wrap;padding:10px 14px 8px;font-size:12px;color:var(--muted)}
.map-caption i{display:inline-flex;align-items:center;gap:6px;font-style:normal}
.dotk{width:9px;height:9px;border-radius:50%;display:inline-block}
svg text{font-family:inherit}
.ksa-land{fill:rgba(24,46,72,.85);stroke:rgba(120,160,205,.4);stroke-width:1.2}
.lane{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:7 7;opacity:0;animation:laneIn .8s ease forwards, dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
@keyframes laneIn{to{opacity:.95}}
.corridor{fill:none;stroke:var(--teal-bright);stroke-width:2.4;stroke-dasharray:3 6;stroke-linecap:round;opacity:0;animation:laneIn .8s .3s ease forwards,dash 1.8s linear infinite}
.city-dot{fill:#8FB4DE;opacity:.8}
.city-dot.rec{fill:var(--gold);r:6;filter:drop-shadow(0 0 6px rgba(232,193,90,.8))}
.port-dot{fill:var(--teal-bright);filter:drop-shadow(0 0 5px rgba(57,196,174,.7))}
.maplab{fill:#B9CADF;font-size:10.5px;font-weight:600}
.maplab.big{fill:#EAF1F8;font-size:12px}
.maplab.dim{fill:#5F7690;font-weight:400}
.ring{fill:none;stroke-width:1.6;opacity:0;animation:laneIn .9s ease forwards}
.arrowhead{fill:var(--gold)}

/* ---------- charts / tiles ---------- */
.tilerow{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin:22px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.tile .v{font-size:30px;font-weight:800;letter-spacing:-.01em}
.tile .l{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.tile .d{font-size:12px;font-weight:700;margin-top:8px;color:var(--teal-bright)}
.bars{display:flex;flex-direction:column;gap:13px;margin-top:16px}
.bar{display:grid;grid-template-columns:150px 1fr 84px;gap:12px;align-items:center;font-size:13.5px}
.bar .tk{height:14px;border-radius:0 4px 4px 0;min-width:3px;transition:width 1s ease}
html[dir=rtl] .bar .tk{border-radius:4px 0 0 4px}
.bar .nm{color:var(--ink2)} .bar .vl{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.04em}
.badge.eligible{background:rgba(63,169,111,.15);color:#5CC98D;border:1px solid rgba(63,169,111,.4)}
.badge.likely{background:rgba(232,193,90,.13);color:var(--gold);border:1px solid rgba(232,193,90,.4)}
.badge.info{background:rgba(91,133,222,.14);color:#8FAAEA;border:1px solid rgba(91,133,222,.4)}

/* ---------- timeline ---------- */
.timeline{position:relative;margin:26px 0 6px;padding-inline-start:26px}
.timeline::before{content:"";position:absolute;inset-block:8px;inset-inline-start:7px;width:2px;
  background:linear-gradient(var(--teal-bright),var(--gold))}
.tstep{position:relative;padding:0 0 26px 18px;}
html[dir=rtl] .tstep{padding:0 18px 26px 0}
.tstep::before{content:"";position:absolute;inset-inline-start:-26px;top:4px;width:16px;height:16px;border-radius:50%;
  background:var(--bg1);border:3px solid var(--teal-bright)}
.tstep b{display:block;font-size:16px;margin-bottom:4px}
.tstep .dur{font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.06em}
.tstep p{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-top:4px;max-width:75ch}

/* ---------- chat dock ---------- */
#chat-fab{position:fixed;inset-inline-end:24px;bottom:24px;z-index:70;width:60px;height:60px;border-radius:50%;
  background:linear-gradient(140deg,#17564C,#0F3A40);border:1px solid rgba(57,196,174,.55);display:grid;place-items:center;
  box-shadow:0 14px 36px rgba(6,40,38,.6);transition:.25s}
#chat-fab:hover{transform:scale(1.06)}
#chat{position:fixed;inset-inline-end:24px;bottom:96px;z-index:70;width:min(400px,calc(100vw - 40px));max-height:min(600px,70vh);
  display:none;flex-direction:column;background:rgba(10,21,38,.97);border:1px solid var(--line2);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
#chat.open{display:flex}
#chat .chead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:rgba(18,35,58,.6)}
#chat .chead b{font-size:15px} #chat .chead span{font-size:11.5px;color:var(--teal-bright)}
#chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:11px 15px;border-radius:15px;font-size:14px;line-height:1.6;white-space:pre-wrap}
.msg.bot{background:rgba(38,153,136,.13);border:1px solid rgba(57,196,174,.25);align-self:flex-start;border-start-start-radius:4px}
.msg.user{background:rgba(91,133,222,.16);border:1px solid rgba(91,133,222,.3);align-self:flex-end;border-start-end-radius:4px}
#chat form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
#chat input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:rgba(8,17,32,.7);color:var(--ink);font-size:14px;outline:none}
.cbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line2);transition:.2s;flex:0 0 auto}
.cbtn:hover{border-color:var(--teal-bright)} .cbtn.rec{background:rgba(192,92,141,.25);border-color:var(--rose);animation:pulse 1.2s infinite}

/* ---------- report ---------- */
#report-sheet{background:#fff;color:#15202E;border-radius:16px;max-width:820px;margin:0 auto;padding:46px 52px;box-shadow:var(--shadow)}
#report-sheet h2{color:#0E1F33} #report-sheet h3{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#0E7C6E;margin:26px 0 10px}
#report-sheet p,#report-sheet li{font-size:14px;line-height:1.7;color:#33455C}
#report-sheet .rep-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:3px solid #E8C15A;padding-bottom:18px}
#report-sheet .rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin-top:8px}
#report-sheet .rep-grid div{font-size:13.5px;padding:7px 0;border-bottom:1px solid #E8EDF4}
#report-sheet .rep-grid b{color:#0E1F33}
#report-sheet .foot{margin-top:30px;padding-top:14px;border-top:1px solid #E1E8F0;font-size:11.5px;color:#7C8AA0;line-height:1.6}
.report-actions{display:flex;gap:12px;justify-content:center;margin:24px 0;flex-wrap:wrap}

/* ---------- misc ---------- */
.attract-ticker{margin-top:40px;border-top:1px solid var(--line);padding-top:20px;font-size:13px;color:var(--muted);line-height:1.8}
footer{border-top:1px solid var(--line);padding:26px;text-align:center;font-size:12.5px;color:var(--muted);line-height:1.8}
footer a{color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:900px){.hero{grid-template-columns:1fr;min-height:auto}.chapter-num{font-size:40px}
  #report-sheet{padding:30px 22px}.bar{grid-template-columns:110px 1fr 74px}}
@media print{
  body{background:#fff}body::before,header,footer,.navrow,.progress,.report-actions,#chat,#chat-fab,.daleel-says{display:none!important}
  .screen{display:none!important;padding:0}#s-report{display:block!important}
  #report-sheet{box-shadow:none;border-radius:0;max-width:none;padding:10mm}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div>
      <div class="logo-word">Daleel<span class="ar">دليل</span></div>
      <div class="logo-sub" data-i18n="tagline">AI Investment Guide</div>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="btn-voice" title="Voice">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    <span id="voice-state" data-i18n="voiceOn">Voice on</span>
  </button>
  <button class="hbtn" id="btn-lang">العربية</button>
  <button class="hbtn" id="btn-restart" data-i18n="restart" style="display:none">Restart</button>
</header>

<main id="app">
  <!-- Screens are rendered by JS into these shells -->
  <section class="screen on" id="s-attract"></section>
  <section class="screen" id="s-journey"></section>
  <section class="screen" id="s-report"></section>
</main>

<button id="chat-fab" title="Ask DALEEL" aria-label="Ask DALEEL">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7FE7D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
</button>
<div id="chat" role="dialog" aria-label="DALEEL assistant">
  <div class="chead">
    <div class="avatar"><svg width="20" height="20" viewBox="0 0 64 64"><path d="M20 46 L32 14 L44 46" stroke="#E8C15A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><b>DALEEL</b><br><span data-i18n="chatSub">Ask me anything about investing with MODON</span></div>
  </div>
  <div id="chat-log"></div>
  <form id="chat-form">
    <input id="chat-in" data-i18n-ph="chatPh" placeholder="Type your question…" autocomplete="off">
    <button type="button" class="cbtn" id="chat-mic" title="Speak">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg>
    </button>
    <button type="submit" class="cbtn" title="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
</div>

<footer>
  <span data-i18n="footNote">DALEEL presents indicative figures from published MODON and national sources. Eligibility snapshots are informational, not legal or financial advice.</span><br>
  daleel.meshnet.co · <span data-i18n="footBy">An AI investment experience for MODON</span>
</footer>

<script>
/* ================= CONFIG =================
   Fill these when backend pieces are ready — the app works fully without them. */

/* Simplified Kingdom outline (equirectangular, tuned for style not survey accuracy) */
const KSA = [[34.95,29.35],[36.6,29.2],[37.5,30.4],[39.2,32.1],[42.0,31.1],[44.7,29.2],[46.5,29.1],[47.45,29.0],[47.7,28.53],[48.42,28.55],[48.85,27.7],[49.2,27.55],[49.66,27.0],[50.2,26.5],[50.15,25.7],[50.8,24.75],[51.25,24.55],[51.6,24.25],[52.6,22.94],[55.15,22.63],[55.65,22.0],[55.0,20.0],[52.0,19.0],[49.1,18.6],[47.5,17.1],[46.4,17.25],[45.2,17.43],[43.9,17.3],[43.2,16.65],[42.75,16.4],[42.3,17.05],[41.2,19.0],[40.3,20.15],[39.15,21.3],[38.98,22.8],[38.0,24.1],[37.2,25.1],[36.4,26.3],[35.68,27.38],[34.95,28.1],[34.63,28.3],[34.95,29.35]];

<script>
/* ================= STATE & HELPERS ================= */
const state = {
  lang: (navigator.language||"en").startsWith("ar") ? "ar" : "en",
  voice: true, step: 0, // 0=attract, 1..6 chapters, 7=report
  profile: { sector:null, scale:"m", current:["sa"], target:[], company:"" },
  lead: null, leads: []
};
try { state.leads = JSON.parse(localStorage.getItem("daleel_leads")||"[]"); } catch(e){}

const $ = s => document.querySelector(s);
const t = k => (I18N[state.lang][k] !== undefined ? I18N[state.lang][k] : (I18N.en[k]||k));
const fmt = (s,o) => s.replace(/\{(\w+)\}/g,(_,k)=>o[k]!==undefined?o[k]:"");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const N = n => new Intl.NumberFormat(state.lang==="ar"?"ar-SA":"en-US").format(n);

/* map projection */
const PX = lon => (lon-34.2)*28, PY = lat => (32.6-lat)*30.5;

/* ================= ANALYSIS ENGINE ================= */
function analyze(p){
  const sec = SECTORS[p.sector];
  const recCities = sec.cities.slice(0,3);
  // score ports: serve target regions + attached to recommended cities
  const scores = {};
  Object.entries(PORTS).forEach(([id,port])=>{
    scores[id] = port.serves.filter(r=>p.target.includes(r)).length*2;
  });
  recCities.forEach(c=>CITIES[c].ports.forEach(pt=>scores[pt]=(scores[pt]||0)+1.5));
  const ports = Object.entries(scores).filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([id])=>id);
  if(!ports.length) ports.push("jeddah","dammam");
  const newRegions = ["sa","gcc",...p.target].filter((r,i,a)=>a.indexOf(r)===i && !p.current.includes(r));
  const newConsumers = newRegions.reduce((s,r)=>s+(REGIONS[r]?REGIONS[r].c:0),0);
  const contMap = {africa:"Africa",europe:"Europe",sasia:"Asia",easia:"Asia",amer:"Americas",mena:"Asia",gcc:"Asia",sa:"Asia"};
  const continents = [...new Set([...newRegions,...p.current].map(r=>contMap[r]))].length;
  const scaleF = {s:.6,m:1,l:1.6}[p.scale];
  const exportSAR = Math.round((p.target.filter(r=>!["sa","gcc"].includes(r)).length*18+12)*scaleF);
  const inc = INCENTIVES.map(i=>({...i,status:i.fit(p)}));
  return { sec, recCities, ports, newRegions, newConsumers, continents,
    demand:[
      {k:"barDom", v:sec.domSAR},
      {k:"barGcc", v:sec.gccSAR},
      {k:"barExport", v:exportSAR}
    ], inc };
}

/* ================= MAP RENDERING ================= */
function ksaPath(){ return "M"+KSA.map(([lo,la])=>PX(lo).toFixed(1)+","+PY(la).toFixed(1)).join("L")+"Z"; }

function laneTarget(region, port){
  // direction endpoints (svg coords) for animated lanes leaving the Kingdom
  const P = {x:PX(port.lon), y:PY(port.lat)};
  const D = {
    europe:{x:-95,y:-40,lab:{x:-60,y:26}}, africa:{x:-105,y:540,lab:{x:-70,y:500}},
    amer:{x:-125,y:200,lab:{x:-88,y:240}}, mena:{x:-40,y:-20,lab:{x:20,y:8}},
    sasia:{x:655,y:410,lab:{x:545,y:445}}, easia:{x:665,y:280,lab:{x:558,y:268}},
    gcc:{x:590,y:320,lab:{x:508,y:356}}, sa:null
  };
  return D[region]||null;
}

function renderMap(opts){
  const {lanes=false, corridors=false, rings=false, recCities=[], ports=[], targets=[]} = opts||{};
  const L = state.lang;
  let s = `<svg viewBox="-135 -55 810 630" style="width:100%;height:auto;display:block" role="img" aria-label="Map of Saudi Arabia">`;
  s += `<path class="ksa-land" d="${ksaPath()}"/>`;
  // region labels
  s += `<text class="maplab dim" x="${PX(44.5)}" y="${PY(23.3)}" text-anchor="middle" font-size="15" letter-spacing="3" opacity=".55">${L==="ar"?"السعودية":"SAUDI ARABIA"}</text>`;
  if(rings){
    const cx=PX(46.7), cy=PY(24.7);
    s += `<circle class="ring" cx="${cx}" cy="${cy}" r="60" stroke="#BE8926" style="animation-delay:.2s"/>
          <circle class="ring" cx="${cx}" cy="${cy}" r="150" stroke="#39C4AE" style="animation-delay:.6s"/>
          <circle class="ring" cx="${cx}" cy="${cy}" r="265" stroke="#5B85DE" style="animation-delay:1s"/>`;
  }
  // corridors from recommended cities to their ports
  if(corridors){
    recCities.forEach((cid,i)=>{ const c=CITIES[cid];
      c.ports.forEach(pid=>{ const p=PORTS[pid];
        s += `<path class="corridor" style="animation-delay:${.3+i*.25}s" d="M${PX(c.lon)},${PY(c.lat)} Q${(PX(c.lon)+PX(p.lon))/2},${Math.min(PY(c.lat),PY(p.lat))-24} ${PX(p.lon)},${PY(p.lat)}"/>`;
      });
    });
  }
  // shipping lanes to target regions
  if(lanes){
    const drawn = new Set();
    targets.forEach((r,ri)=>{
      // pick best port for the region
      const pid = ports.find(id=>PORTS[id].serves.includes(r)) || ports[0];
      if(!pid) return; const port = PORTS[pid];
      const d = laneTarget(r, port); if(!d) return;
      const key = r; if(drawn.has(key)) return; drawn.add(key);
      const mx=(PX(port.lon)+d.x)/2, my=(PY(port.lat)+d.y)/2 - 30;
      s += `<path class="lane" style="animation-delay:${.4+ri*.3}s" d="M${PX(port.lon)},${PY(port.lat)} Q${mx},${my} ${d.x},${d.y}"/>`;
      s += `<text class="maplab big" x="${d.lab.x}" y="${d.lab.y}" opacity="0" style="animation:laneIn .6s ${(0.7+ri*.3)}s ease forwards">${esc(I18N[L].regions[r]||r)}</text>`;
    });
  }
  // cities
  Object.entries(CITIES).forEach(([id,c])=>{
    const rec = recCities.includes(id);
    s += `<circle class="city-dot${rec?" rec":""}" cx="${PX(c.lon)}" cy="${PY(c.lat)}" r="${rec?6:3.4}"/>`;
    if(rec) s += `<text class="maplab" x="${PX(c.lon)+9}" y="${PY(c.lat)+4}">${esc(c[L].split("(")[0].trim())}</text>`;
  });
  // ports
  ports.forEach(pid=>{ const p=PORTS[pid];
    s += `<rect class="port-dot" x="${PX(p.lon)-5}" y="${PY(p.lat)-5}" width="10" height="10" rx="2.5" transform="rotate(45 ${PX(p.lon)} ${PY(p.lat)})"/>
          <text class="maplab" x="${PX(p.lon)+(p.coast==="gulf"?10:-10)}" y="${PY(p.lat)+4}" text-anchor="${p.coast==="gulf"?"start":"end"}">${esc(p[L])}</text>`;
  });
  s += `</svg>`;
  const legend = `<div class="map-caption">
      <i><span class="dotk" style="background:#39C4AE"></span>${t("legPort")}</i>
      <i><span class="dotk" style="background:#8FB4DE"></span>${t("legCity")}</i>
      ${recCities.length?`<i><span class="dotk" style="background:#E8C15A"></span>${t("legRec")}</i>`:""}
      ${lanes?`<i><span class="dotk" style="background:#E8C15A;border-radius:2px;height:3px;width:16px"></span>${t("legLane")}</i>`:""}
      ${corridors?`<i><span class="dotk" style="background:#39C4AE;border-radius:2px;height:3px;width:16px"></span>${t("legCorr")}</i>`:""}
    </div>`;
  return `<div class="mapwrap">${s}${legend}</div>`;
}
</script>
<script>

  </div>

function renderJourney(){

    J.innerHTML = chapterChrome(1,t("ch1Title"),say(t("ch1Say")))+`
    <div class="f-label">${t("fSector")}</div>
    <div class="grid g4" id="sector-grid">${Object.entries(SECTORS).map(([id,s])=>`
      <button class="card pick ${p.sector===id?"sel":""}" data-s="${id}"><span class="ico">${s.ico}</span><h3>${esc(s[state.lang])}</h3></button>`).join("")}
    </div>

/* ================= VOICE ================= */
let voices = [];
function loadVoices(){ voices = speechSynthesis ? speechSynthesis.getVoices() : []; }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function speak(html){
  if(!state.voice || !("speechSynthesis" in window)) return;
  const txt = html.replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
  if(!txt) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  const pref = state.lang==="ar" ? "ar" : "en";
  const v = voices.find(v=>v.lang.toLowerCase().startsWith(pref) && /natural|neural|online/i.test(v.name)) || voices.find(v=>v.lang.toLowerCase().startsWith(pref));
  if(v) u.voice = v;
  u.lang = state.lang==="ar"?"ar-SA":"en-US"; u.rate = 1.02; u.pitch = 1;
  speechSynthesis.speak(u);
}

/* speech recognition (chat mic) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function listen(onText){
  if(!SR){ addMsg("bot", t("micNo")); return null; }
  const r = new SR(); r.lang = state.lang==="ar"?"ar-SA":"en-US"; r.interimResults=false; r.maxAlternatives=1;
  r.onresult = e=>onText(e.results[0][0].transcript);
  r.start(); return r;
}

/* ================= CHAT (hybrid) ================= */
const chatHistory = [];
function openChat(sayHi){
  $("#chat").classList.add("open");
  if(sayHi && !chatHistory.length) addMsg("bot", t("chatHi"));
  $("#chat-in").focus();
}
function addMsg(kind, text){
  const d = document.createElement("div"); d.className="msg "+kind; d.textContent=text;
  $("#chat-log").appendChild(d); $("#chat-log").scrollTop = 1e6;
  if(kind==="bot") speak(text);
  chatHistory.push({role:kind==="bot"?"assistant":"user",content:text});
}

async function botReply(q){
  if(CONFIG.LLM_ENDPOINT){
    const thinking = document.createElement("div"); thinking.className="msg bot"; thinking.textContent=t("chatThinking");
    $("#chat-log").appendChild(thinking); $("#chat-log").scrollTop=1e6;
    try{
      const res = await fetch(CONFIG.LLM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:chatHistory.slice(-10), profile:state.profile, lang:state.lang})});
      const j = await res.json(); thinking.remove();
      addMsg("bot", j.reply || j.message || fmt(t("chatFallback"),{email:CONFIG.CONTACT_EMAIL}));
      return;
    }catch(e){ thinking.remove(); /* fall through to rules */ }
  }
  const rule = KB_RULES.find(r=>r.k.test(q));
  addMsg("bot", rule ? rule[state.lang]() : fmt(t("chatFallback"),{email:CONFIG.CONTACT_EMAIL}));
}

  $("#btn-lang").textContent = state.lang==="ar"?"English":"العربية";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.innerHTML=t(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  $("#voice-state").textContent = state.voice?t("voiceOn"):t("voiceOff");
  document.title = state.lang==="ar" ? "دليل Daleel — دليل الاستثمار بالذكاء الاصطناعي" : "Daleel دليل — AI Investment Guide";
  if(state.step===0) renderAttract();
  else if(state.step===7) renderReport();
  else renderJourney();
}

$("#btn-lang").onclick = ()=>{ state.lang = state.lang==="ar"?"en":"ar"; speechSynthesis && speechSynthesis.cancel(); applyLang(); };
$("#btn-voice").onclick = ()=>{ state.voice=!state.voice; if(!state.voice && "speechSynthesis" in window) speechSynthesis.cancel();
  $("#btn-voice").classList.toggle("active",state.voice); $("#voice-state").textContent=state.voice?t("voiceOn"):t("voiceOff"); };
$("#btn-restart").onclick = ()=>{ state.step=0; state.profile={sector:null,scale:"m",current:["sa"],target:[],company:""}; speechSynthesis&&speechSynthesis.cancel(); renderAttract(); };
$("#chat-fab").onclick = ()=>{ $("#chat").classList.contains("open") ? $("#chat").classList.remove("open") : openChat(true); };
$("#chat-form").onsubmit = e=>{ e.preventDefault(); const v=$("#chat-in").value.trim(); if(!v) return;
  addMsg("user",v); $("#chat-in").value=""; botReply(v); };
$("#chat-mic").onclick = ()=>{ $("#chat-mic").classList.add("rec");
  const r = listen(txt=>{ $("#chat-mic").classList.remove("rec"); $("#chat-in").value=txt; $("#chat-form").requestSubmit(); });
  if(r){ r.onend=()=>$("#chat-mic").classList.remove("rec"); } else $("#chat-mic").classList.remove("rec"); };

/* leads export for the MODON team: open the site with ?admin=1 */
if(new URLSearchParams(location.search).get("admin")==="1"){
  const b=document.createElement("button"); b.className="cta ghost"; b.style.margin="10px auto"; b.textContent="⬇ Export leads CSV ("+state.leads.length+")";
  b.onclick=()=>{ const rows=[["ts","name","email","phone","company","sector","scale","current","target","meeting","lang"],
    ...state.leads.map(l=>[l.ts,l.name,l.email,l.phone,l.company,l.sector,l.scale,l.current,l.target,l.meet,l.lang])];
    const csv=rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"})); a.download="daleel-leads.csv"; a.click(); };
  document.querySelector("footer").prepend(b);
}

$("#btn-voice").classList.add("active");
applyLang();
</script>
<canvas id="plexus" aria-hidden="true"></canvas>
<script>
/* ---- ambient network backdrop (plexus) ---- */
(function(){
  const c=document.getElementById("plexus"); if(!c) return;
  const x=c.getContext("2d"); let W,H,pts=[],raf;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+"px";c.style.height=innerHeight+"px";seed();}
  function seed(){
    const n=Math.min(90,Math.floor(innerWidth*innerHeight/16000));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.12*devicePixelRatio,vy:(Math.random()-.5)*.12*devicePixelRatio,
      r:(Math.random()*1.4+.6)*devicePixelRatio}));
  }
  const LINK=150*devicePixelRatio;
  function tick(){
    x.clearRect(0,0,W,H);
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1; if(p.y<0||p.y>H)p.vy*=-1;}
    for(let i=0;i<pts.length;i++){
      const a=pts[i];
      for(let j=i+1;j<pts.length;j++){
        const b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d=Math.hypot(dx,dy);
        if(d<LINK){const o=(1-d/LINK)*.16;
          x.strokeStyle=`rgba(96,170,190,${o})`;x.lineWidth=devicePixelRatio*.7;
          x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();}
      }
      x.fillStyle="rgba(140,200,215,.5)";
      x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill();
    }
    if(!reduced) raf=requestAnimationFrame(tick);
  }
  addEventListener("resize",()=>{cancelAnimationFrame(raf);size();tick();},{passive:true});
  size();tick();
})();
</script>
</body>
