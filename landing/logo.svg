<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="20" fill="#0a0f1e"/>
  <!-- Hex grid background -->
  <g opacity="0.15" stroke="#3b4a6b" stroke-width="0.5" fill="none">
    <polygon points="40,10 60,10 70,27 60,44 40,44 30,27"/>
    <polygon points="80,10 100,10 110,27 100,44 80,44 70,27"/>
    <polygon points="120,10 140,10 150,27 140,44 120,44 110,27"/>
    <polygon points="160,10 180,10 190,27 180,44 160,44 150,27"/>
    <polygon points="60,44 80,44 90,61 80,78 60,78 50,61"/>
    <polygon points="100,44 120,44 130,61 120,78 100,78 90,61"/>
    <polygon points="140,44 160,44 170,61 160,78 140,78 130,61"/>
    <polygon points="40,78 60,78 70,95 60,112 40,112 30,95"/>
    <polygon points="80,78 100,78 110,95 100,112 80,112 70,95"/>
    <polygon points="120,78 140,78 150,95 140,112 120,112 110,95"/>
    <polygon points="160,78 180,78 190,95 180,112 160,112 150,95"/>
  </g>
  <!-- Main wave path -->
  <path d="M 10 100 C 30 60, 50 60, 70 100 C 90 140, 110 140, 130 100 C 150 60, 170 60, 190 100"
        stroke="url(#grad)" stroke-width="12" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Circuit dots on wave -->
  <circle cx="10" cy="100" r="5" fill="#7c3aed" filter="url(#glow)"/>
  <circle cx="40" cy="72" r="5" fill="#9333ea" filter="url(#glow)"/>
  <circle cx="70" cy="100" r="5" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="100" cy="128" r="5" fill="#22d3ee" filter="url(#glow)"/>
  <circle cx="130" cy="100" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="160" cy="72" r="5" fill="#0891b2" filter="url(#glow)"/>
  <circle cx="190" cy="100" r="5" fill="#06b6d4" filter="url(#glow)"/>
  <!-- Circuit lines from dots -->
  <g stroke="#a855f7" stroke-width="1" opacity="0.6">
    <line x1="40" y1="72" x2="40" y2="55"/>
    <line x1="35" y1="55" x2="45" y2="55"/>
    <line x1="70" y1="100" x2="70" y2="115"/>
    <line x1="65" y1="120" x2="75" y2="120"/>
    <line x1="100" y1="128" x2="85" y2="128"/>
    <line x1="130" y1="100" x2="145" y2="100"/>
    <line x1="145" y1="95" x2="145" y2="105"/>
  </g>
</svg>