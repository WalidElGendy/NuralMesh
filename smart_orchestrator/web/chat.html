<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuralMesh Chat</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080611;
      --panel: rgba(19, 13, 35, 0.86);
      --panel-strong: rgba(31, 20, 56, 0.96);
      --line: rgba(188, 143, 255, 0.18);
      --text: #f7f2ff;
      --muted: #a99dbc;
      --accent: #a855f7;
      --accent-2: #22d3ee;
      --danger: #fb7185;
      --ok: #86efac;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.28), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(34, 211, 238, 0.16), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, textarea, select, input {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
      cursor: pointer;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      height: 100vh;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      border-right: 1px solid var(--line);
      background: rgba(8, 6, 17, 0.9);
      padding: 18px;
      min-width: 0;
      transition: transform 180ms ease;
      z-index: 4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(168, 85, 247, 0.55);
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.8), rgba(34, 211, 238, 0.34));
      box-shadow: 0 0 32px rgba(168, 85, 247, 0.28);
    }

    .new-chat,
    .send {
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.28);
      font-weight: 700;
    }

    .new-chat {
      padding: 12px;
      width: 100%;
    }

    .conversation-list {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 8px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 2px;
    }

    .conversation {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--muted);
      padding: 11px 12px;
      text-align: left;
    }

    .conversation:hover,
    .conversation.active {
      border-color: var(--line);
      background: rgba(168, 85, 247, 0.12);
      color: var(--text);
    }

    .main {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      background: rgba(8, 6, 17, 0.68);
      padding: 14px 20px;
      backdrop-filter: blur(14px);
    }

    .menu-button {
      display: none;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 9px 11px;
    }

    .title-block strong {
      display: block;
      font-size: 15px;
    }

    .title-block span,
    .user-email,
    .meta {
      color: var(--muted);
      font-size: 12px;
    }

    .user-menu {
      position: relative;
    }

    .user-button {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      padding: 9px 12px;
    }

    .dropdown,
    .context-menu {
      position: absolute;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel-strong);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      padding: 8px;
      z-index: 10;
    }

    .dropdown {
      top: 44px;
      right: 0;
      min-width: 180px;
    }

    .dropdown[hidden],
    .context-menu[hidden],
    .modal-backdrop[hidden] {
      display: none;
    }

    .dropdown button,
    .context-menu button {
      display: block;
      width: 100%;
      border-radius: 10px;
      background: transparent;
      padding: 9px 10px;
      text-align: left;
    }

    .dropdown button:hover,
    .context-menu button:hover {
      background: rgba(168, 85, 247, 0.14);
    }

    .messages {
      min-width: 0;
      overflow-y: auto;
      padding: 26px max(20px, 10vw) 150px;
    }

    .empty {
      display: grid;
      min-height: 100%;
      place-items: center;
    }

    .empty-card {
      width: min(760px, 100%);
      text-align: center;
    }

    .empty-card h1 {
      margin: 0 0 10px;
      font-size: clamp(32px, 6vw, 58px);
      letter-spacing: -0.06em;
    }

    .prompt-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
    }

    .prompt-card {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.055);
      padding: 18px;
      text-align: left;
    }

    .prompt-card:hover {
      border-color: rgba(168, 85, 247, 0.52);
      background: rgba(168, 85, 247, 0.12);
    }

    .message {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 14px;
      margin: 0 auto 22px;
      max-width: 900px;
    }

    .avatar {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--accent-2);
      font-weight: 800;
    }

    .message.user .avatar {
      color: #f0abfc;
    }

    .bubble {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      padding: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.58;
    }

    .message-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .role {
      font-weight: 800;
    }

    .badge {
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.1);
      color: #b7f7ff;
      padding: 3px 8px;
      font-size: 11px;
    }

    .composer-wrap {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 280px;
      border-top: 1px solid var(--line);
      background: linear-gradient(180deg, transparent, rgba(8, 6, 17, 0.92) 18%);
      padding: 24px max(20px, 10vw) 20px;
      transition: left 180ms ease;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      max-width: 900px;
      margin: 0 auto;
      border: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 22px;
      background: rgba(15, 10, 29, 0.96);
      padding: 12px;
      box-shadow: 0 18px 80px rgba(0, 0, 0, 0.4);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      grid-column: 1 / -1;
      gap: 8px;
    }

    select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 0 12px;
    }

    textarea {
      width: 100%;
      max-height: 180px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      line-height: 1.5;
    }

    .send {
      align-self: end;
      min-width: 84px;
      min-height: 44px;
      padding: 0 18px;
    }

    .send:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .notice {
      max-width: 900px;
      margin: 0 auto 10px;
      border: 1px solid rgba(251, 113, 133, 0.28);
      border-radius: 14px;
      background: rgba(251, 113, 133, 0.1);
      color: #fecdd3;
      padding: 10px 12px;
    }

    .notice a {
      color: #f0abfc;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    .modal {
      width: min(430px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel-strong);
      padding: 20px;
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.5);
    }

    .modal input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      padding: 11px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }

    .secondary {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      padding: 10px 13px;
    }

    @media (max-width: 820px) {
      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-open::after {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        content: "";
        z-index: 3;
      }

      .shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(86vw, 300px);
        transform: translateX(-105%);
      }

      .menu-button {
        display: inline-flex;
      }

      .messages {
        padding: 20px 16px 150px;
      }

      .composer-wrap {
        left: 0;
        padding: 18px 12px 14px;
      }

      .prompt-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Conversation history">
      <div class="brand"><span class="brand-mark">N</span><span>NeuralMesh</span></div>
      <button class="new-chat" id="newChat">New chat</button>
      <nav class="conversation-list" id="conversationList" aria-label="Past conversations"></nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="Open conversations">☰</button>
        <div class="title-block">
          <strong id="chatTitle">AI Chat</strong>
          <span>Auto routes to sovereign nodes, with Fast available on Groq.</span>
        </div>
        <div class="user-menu">
          <button class="user-button" id="userButton"><span class="user-email" id="userEmail"></span> ▾</button>
          <div class="dropdown" id="userDropdown" hidden>
            <button id="settingsButton">Settings</button>
            <button id="subscriptionButton">Subscription</button>
            <button id="logoutButton">Logout</button>
          </div>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="composer-wrap">
        <div class="notice" id="notice" hidden></div>
        <form class="composer" id="composer">
          <div class="controls">
            <select id="modelSelect" aria-label="Model">
              <option value="llama-3.3-70b" selected>Llama 3.3 70B</option>
              <option value="groq-llama-3.3-70b">Groq Llama 3.3 70B (Fast)</option>
            </select>
            <select id="modeSelect" aria-label="Mode">
              <option value="auto" selected>Mode: Auto</option>
              <option value="sovereign">Mode: Sovereign</option>
              <option value="fast">Mode: Fast</option>
            </select>
          </div>
          <textarea id="prompt" rows="1" placeholder="Ask NeuralMesh..." aria-label="Prompt"></textarea>
          <button class="send" id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>
  </div>

  <div class="context-menu" id="contextMenu" hidden>
    <button id="renameConversation">Rename</button>
    <button id="deleteConversation">Delete</button>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Settings</h2>
      <p class="meta" id="modalHelp">Set the temporary Sprint C beta UUID used for API requests.</p>
      <input id="modalInput" />
      <div class="modal-actions">
        <button class="secondary" id="modalCancel">Cancel</button>
        <button class="new-chat" id="modalSave">Save</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      conversations: [],
      activeConversationId: null,
      activeContextId: null,
      lastPrompt: "",
      streaming: false,
      betaUserId: getBetaUserId(),
    };

    const el = {
      body: document.body,
      list: document.getElementById("conversationList"),
      messages: document.getElementById("messages"),
      prompt: document.getElementById("prompt"),
      composer: document.getElementById("composer"),
      send: document.getElementById("sendButton"),
      title: document.getElementById("chatTitle"),
      notice: document.getElementById("notice"),
      model: document.getElementById("modelSelect"),
      mode: document.getElementById("modeSelect"),
      userEmail: document.getElementById("userEmail"),
      userButton: document.getElementById("userButton"),
      userDropdown: document.getElementById("userDropdown"),
      settingsButton: document.getElementById("settingsButton"),
      subscriptionButton: document.getElementById("subscriptionButton"),
      logoutButton: document.getElementById("logoutButton"),
      menuButton: document.getElementById("menuButton"),
      newChat: document.getElementById("newChat"),
      contextMenu: document.getElementById("contextMenu"),
      renameConversation: document.getElementById("renameConversation"),
      deleteConversation: document.getElementById("deleteConversation"),
      modalBackdrop: document.getElementById("modalBackdrop"),
      modalTitle: document.getElementById("modalTitle"),
      modalHelp: document.getElementById("modalHelp"),
      modalInput: document.getElementById("modalInput"),
      modalCancel: document.getElementById("modalCancel"),
      modalSave: document.getElementById("modalSave"),
    };

    const examples = [
      "Explain how NeuralMesh chooses a sovereign node for an AI request.",
      "Draft a launch checklist for a beta AI infrastructure product.",
      "Compare decentralized inference to a hosted Groq fallback.",
      "Write a Python example that streams Server-Sent Events.",
    ];

    function getBetaUserId() {
      let value = localStorage.getItem("nm_beta_user_id");
      if (!value) {
        value = crypto.randomUUID ? crypto.randomUUID() : "11111111-1111-4111-8111-111111111111";
        localStorage.setItem("nm_beta_user_id", value);
      }
      return value;
    }

    function authHeaders() {
      return {
        "Content-Type": "application/json",
        "X-Beta-User-Id": state.betaUserId,
      };
    }

    function friendlyEmail() {
      return `beta-${state.betaUserId.slice(0, 8)}@neuralmesh.test`;
    }

    function setNotice(message, isLimit = false) {
      el.notice.hidden = !message;
      el.notice.innerHTML = isLimit
        ? `${message} <a href="/landing/index.html#pricing">Upgrade</a>`
        : message;
    }

    function resizePrompt() {
      el.prompt.style.height = "auto";
      el.prompt.style.height = `${Math.min(el.prompt.scrollHeight, 180)}px`;
    }

    function renderEmpty() {
      el.title.textContent = "AI Chat";
      el.messages.innerHTML = `
        <div class="empty">
          <div class="empty-card">
            <h1>Ask NeuralMesh</h1>
            <p class="meta">Start with sovereign routing or switch to Fast for Groq-backed replies.</p>
            <div class="prompt-grid">
              ${examples.map((prompt) => `<button class="prompt-card" type="button">${prompt}</button>`).join("")}
            </div>
          </div>
        </div>`;
      [...el.messages.querySelectorAll(".prompt-card")].forEach((button) => {
        button.addEventListener("click", () => {
          el.prompt.value = button.textContent.trim();
          resizePrompt();
          el.prompt.focus();
        });
      });
    }

    function renderConversations() {
      el.list.innerHTML = "";
      state.conversations.forEach((conversation) => {
        const button = document.createElement("button");
        button.className = `conversation ${conversation.id === state.activeConversationId ? "active" : ""}`;
        button.textContent = conversation.title;
        button.addEventListener("click", () => loadConversation(conversation.id));
        button.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          state.activeContextId = conversation.id;
          el.contextMenu.style.left = `${event.clientX}px`;
          el.contextMenu.style.top = `${event.clientY}px`;
          el.contextMenu.hidden = false;
        });
        el.list.appendChild(button);
      });
    }

    function messageNode(role, content, meta = {}) {
      const node = document.createElement("article");
      node.className = `message ${role}`;
      node.innerHTML = `
        <div class="avatar">${role === "user" ? "U" : "N"}</div>
        <div class="bubble">
          <div class="message-head">
            <span class="role">${role === "user" ? "You" : "Assistant"}</span>
            <span class="badge">${meta.served_by || (role === "user" ? "User" : "Streaming")}</span>
            <span class="meta">${meta.tokens || 0} tokens</span>
            <span class="meta">${meta.latency_ms || 0} ms</span>
          </div>
          <div class="content"></div>
        </div>`;
      node.querySelector(".content").textContent = content;
      return node;
    }

    function appendMessage(role, content, meta) {
      if (el.messages.querySelector(".empty")) {
        el.messages.innerHTML = "";
      }
      const node = messageNode(role, content, meta);
      el.messages.appendChild(node);
      el.messages.scrollTop = el.messages.scrollHeight;
      return node;
    }

    function updateAssistantMeta(node, done) {
      node.querySelector(".badge").textContent = done.served_by;
      const meta = node.querySelectorAll(".meta");
      meta[0].textContent = `${done.tokens} tokens`;
      meta[1].textContent = `${done.latency_ms} ms`;
    }

    async function loadConversations() {
      const response = await fetch("/api/conversations", { headers: authHeaders() });
      if (!response.ok) throw new Error("Unable to load conversations");
      const payload = await response.json();
      state.conversations = payload.conversations || [];
      renderConversations();
      if (!state.activeConversationId && state.conversations.length === 0) {
        renderEmpty();
      }
    }

    async function loadConversation(id) {
      const response = await fetch(`/api/conversations/${id}/messages`, { headers: authHeaders() });
      if (!response.ok) return;
      const payload = await response.json();
      state.activeConversationId = id;
      el.title.textContent = payload.conversation.title;
      el.messages.innerHTML = "";
      payload.messages.forEach((message) => appendMessage(message.role, message.content, message));
      renderConversations();
      el.body.classList.remove("sidebar-open");
    }

    async function handleSse(response, assistantNode) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const frames = buffer.split("\n\n");
        buffer = frames.pop();
        frames.forEach((frame) => handleFrame(frame, assistantNode));
      }
      if (buffer) handleFrame(buffer, assistantNode);
    }

    function handleFrame(frame, assistantNode) {
      const eventLine = frame.split("\n").find((line) => line.startsWith("event:"));
      const dataLine = frame.split("\n").find((line) => line.startsWith("data:"));
      if (!eventLine || !dataLine) return;
      const event = eventLine.replace("event:", "").trim();
      const data = JSON.parse(dataLine.replace("data:", "").trim());
      if (event === "conversation") {
        state.activeConversationId = data.conversation_id;
        el.title.textContent = data.title;
      }
      if (event === "token") {
        const content = assistantNode.querySelector(".content");
        content.textContent += data.text;
        el.messages.scrollTop = el.messages.scrollHeight;
      }
      if (event === "done") {
        updateAssistantMeta(assistantNode, data);
      }
    }

    async function sendMessage() {
      const message = el.prompt.value.trim();
      if (!message || state.streaming) return;
      state.streaming = true;
      state.lastPrompt = message;
      el.prompt.value = "";
      resizePrompt();
      el.send.disabled = true;
      setNotice("");

      appendMessage("user", message, { served_by: "User", tokens: Math.max(1, message.split(/\s+/).length), latency_ms: 0 });
      const assistantNode = appendMessage("assistant", "", { served_by: "Streaming", tokens: 0, latency_ms: 0 });

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({
            conversation_id: state.activeConversationId,
            message,
            mode: el.mode.value,
            model: el.model.value,
          }),
        });
        if (response.status === 429) {
          const payload = await response.json().catch(() => ({}));
          setNotice(payload.detail || "You've reached your daily limit. Upgrade to keep chatting.", true);
          assistantNode.remove();
          return;
        }
        if (!response.ok) {
          const payload = await response.json().catch(() => ({}));
          throw new Error(payload.detail || "Chat request failed");
        }
        await handleSse(response, assistantNode);
        await loadConversations();
        renderConversations();
      } catch (error) {
        assistantNode.querySelector(".content").textContent = error.message;
        assistantNode.querySelector(".badge").textContent = "Error";
      } finally {
        state.streaming = false;
        el.send.disabled = false;
        el.prompt.focus();
      }
    }

    function openSettings(kind = "settings") {
      el.modalTitle.textContent = kind === "rename" ? "Rename conversation" : "Settings";
      el.modalHelp.textContent = kind === "rename"
        ? "Update the conversation title."
        : "Set the temporary Sprint C beta UUID used for API requests.";
      el.modalInput.value = kind === "rename"
        ? state.conversations.find((item) => item.id === state.activeContextId)?.title || ""
        : state.betaUserId;
      el.modalSave.dataset.kind = kind;
      el.modalBackdrop.hidden = false;
      el.modalInput.focus();
      el.modalInput.select();
    }

    async function saveModal() {
      const kind = el.modalSave.dataset.kind;
      const value = el.modalInput.value.trim();
      if (!value) return;
      if (kind === "rename") {
        await fetch(`/api/conversations/${state.activeContextId}`, {
          method: "PATCH",
          headers: authHeaders(),
          body: JSON.stringify({ title: value }),
        });
        await loadConversations();
        if (state.activeConversationId === state.activeContextId) {
          el.title.textContent = value;
        }
      } else {
        state.betaUserId = value;
        localStorage.setItem("nm_beta_user_id", value);
        el.userEmail.textContent = friendlyEmail();
        state.activeConversationId = null;
        await loadConversations();
      }
      closeModal();
    }

    function closeModal() {
      el.modalBackdrop.hidden = true;
    }

    el.composer.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });
    el.prompt.addEventListener("input", resizePrompt);
    el.prompt.addEventListener("keydown", (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
      if (event.key === "ArrowUp" && !el.prompt.value && state.lastPrompt) {
        event.preventDefault();
        el.prompt.value = state.lastPrompt;
        resizePrompt();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        el.contextMenu.hidden = true;
        closeModal();
        el.userDropdown.hidden = true;
        el.body.classList.remove("sidebar-open");
      }
    });
    document.addEventListener("click", (event) => {
      if (!el.contextMenu.contains(event.target)) el.contextMenu.hidden = true;
      if (!el.userButton.contains(event.target) && !el.userDropdown.contains(event.target)) {
        el.userDropdown.hidden = true;
      }
    });
    el.userButton.addEventListener("click", () => {
      el.userDropdown.hidden = !el.userDropdown.hidden;
    });
    el.settingsButton.addEventListener("click", () => openSettings("settings"));
    el.subscriptionButton.addEventListener("click", () => {
      window.location.href = "/dashboard/billing.html";
    });
    el.logoutButton.addEventListener("click", () => {
      localStorage.removeItem("nm_beta_user_id");
      window.location.reload();
    });
    el.menuButton.addEventListener("click", () => el.body.classList.toggle("sidebar-open"));
    el.newChat.addEventListener("click", () => {
      state.activeConversationId = null;
      renderEmpty();
      renderConversations();
      el.body.classList.remove("sidebar-open");
      el.prompt.focus();
    });
    el.renameConversation.addEventListener("click", () => openSettings("rename"));
    el.deleteConversation.addEventListener("click", async () => {
      if (!state.activeContextId) return;
      await fetch(`/api/conversations/${state.activeContextId}`, {
        method: "DELETE",
        headers: authHeaders(),
      });
      if (state.activeConversationId === state.activeContextId) {
        state.activeConversationId = null;
        renderEmpty();
      }
      await loadConversations();
    });
    el.modalCancel.addEventListener("click", closeModal);
    el.modalSave.addEventListener("click", saveModal);

    el.userEmail.textContent = friendlyEmail();
    renderEmpty();
    loadConversations().catch((error) => setNotice(error.message));
  </script>
</body>
</html>
