<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat - NeuralMesh Beta</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-950 text-white">
  <main class="mx-auto max-w-3xl px-6 py-12">
    <nav class="mb-8 flex justify-between text-sm"><a href="/account.html">Account</a><a href="/host/terms.html">Provider terms</a></nav>
    <h1 class="text-4xl font-bold">NeuralMesh chat</h1>
    <form id="chat-form" class="mt-8">
      <textarea id="prompt" rows="6" class="w-full rounded-2xl bg-black/40 p-4" placeholder="Ask the beta network..." required></textarea>
      <button class="mt-4 rounded-xl bg-violet-600 px-5 py-3 font-semibold">Send</button>
    </form>
    <pre id="output" class="mt-6 min-h-56 whitespace-pre-wrap rounded-2xl border border-white/10 bg-black/40 p-4 text-sm"></pre>
  </main>
  <script>
    function csrfToken() {
      return document.cookie.split("; ").find((row) => row.startsWith("nm_csrf="))?.split("=")[1] || "";
    }
    document.getElementById("chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const prompt = document.getElementById("prompt");
      const output = document.getElementById("output");
      output.textContent = "Sending...";
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json", "X-CSRF-Token": csrfToken()},
        body: JSON.stringify({stream: false, messages: [{role: "user", content: prompt.value}]}),
      });
      const data = await response.json().catch(() => ({}));
      if (response.status === 402) {
        output.textContent = data.message;
        window.location.href = data.checkout_url;
        return;
      }
      if (!response.ok) {
        output.textContent = data.detail || "Chat failed";
        return;
      }
      output.textContent = data.answer || JSON.stringify(data, null, 2);
      prompt.value = "";
    });
  </script>
</body>
</html>
