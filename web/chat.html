<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Console · NeuralMesh</title>
<meta name="description" content="Analyst console on the sovereign GPU mesh. Grounded answers, live provenance, linked knowledge." />
<link rel="icon" href="https://meshnet.co/favicon.ico" />
<style>
/* =========================================================================
   NeuralMesh Console — design tokens
   Instrument-panel aesthetic: hairline grid, tabular data, visible provenance.
   Deliberately NOT the centred-bubble-column look of Grok / Kimi / ChatGPT.
   ========================================================================= */
:root {
  color-scheme: dark;

  /* --- surfaces (cool near-black; validator surface = --s-1) --- */
  --s-0: #0a0c0f;          /* page plane        */
  --s-1: #12151a;          /* panel / chart     */
  --s-2: #171b21;          /* elevated card     */
  --s-3: #1e232b;          /* hover / input     */

  /* --- ink --- */
  --ink-1: #ffffff;
  --ink-2: #b9c0cb;
  --ink-3: #7d8695;        /* muted: axes, labels */
  --ink-4: #4d5563;

  /* --- structure --- */
  --line:      #222831;    /* hairline grid  */
  --line-2:    #2e3641;    /* baseline/axis  */
  --ring:      rgba(255,255,255,.08);

  /* --- brand: reserved for LIVE MESH STATE ONLY, never a data series --- */
  --signal:    #2ee6c0;
  --signal-dim:rgba(46,230,192,.14);

  /* --- interactive --- */
  --accent:    #3987e5;
  --accent-dim:rgba(57,135,229,.16);

  /* --- categorical series (validated: dark mode, surface #12151a) ---
     node scripts/validate_palette.js "#3987e5,#d95926,#199e70,#c98500,#d55181,#008300" \
        --mode dark --surface "#12151a"   ->  ALL CHECKS PASS
     Assign in fixed slot order. Never cycle. 7th+ series folds into "Other". */
  --series-1: #3987e5;  /* blue    */
  --series-2: #d95926;  /* orange  */
  --series-3: #199e70;  /* aqua    */
  --series-4: #c98500;  /* yellow  */
  --series-5: #d55181;  /* magenta */
  --series-6: #008300;  /* green   */

  /* --- sequential ramp (single hue, light -> dark) --- */
  --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec;
  --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#184f95;

  /* --- status (fixed, never themed, never a series) --- */
  --ok:       #0ca30c;
  --warn:     #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  /* --- type --- */
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, monospace;
  --arabic: "Noto Naskh Arabic", "Geeza Pro", "Segoe UI", var(--sans);

  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --rail: 52px; --threads: 252px; --canvas: 396px;
}

/* Light mode is a *selected* set, not an inverted one. */
:root[data-theme="light"] {
  color-scheme: light;
  --s-0:#f7f8f9; --s-1:#ffffff; --s-2:#fbfbfc; --s-3:#eef0f3;
  --ink-1:#0b0e12; --ink-2:#3d4552; --ink-3:#6b7480; --ink-4:#9aa3af;
  --line:#e4e7ec; --line-2:#cdd3db; --ring:rgba(11,14,18,.10);
  --signal:#0d9b80; --signal-dim:rgba(13,155,128,.12);
  --accent:#2a78d6; --accent-dim:rgba(42,120,214,.12);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
  --series-4:#eda100; --series-5:#e87ba4; --series-6:#008300;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--s-0); color: var(--ink-1);
  font-family: var(--sans); font-size: 14px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
:lang(ar), [dir="rtl"] { font-family: var(--arabic); }
button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; }
::selection { background: var(--accent-dim); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-sm); }

/* scrollbars: hairline, not chrome */
*::-webkit-scrollbar { width: 8px; height: 8px; }
*::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
*::-webkit-scrollbar-track { background: transparent; }

/* =========================== SHELL ================================== */
#app {
  display: grid; height: 100dvh;
  grid-template-columns: var(--rail) var(--threads) minmax(0,1fr) var(--canvas);
  transition: grid-template-columns .22s cubic-bezier(.4,0,.2,1);
}
#app[data-threads="off"] { grid-template-columns: var(--rail) 0 minmax(0,1fr) var(--canvas); }
#app[data-canvas="off"]  { grid-template-columns: var(--rail) var(--threads) minmax(0,1fr) 0; }
#app[data-threads="off"][data-canvas="off"] { grid-template-columns: var(--rail) 0 minmax(0,1fr) 0; }

/* ---------------------------- RAIL ---------------------------------- */
.rail {
  background: var(--s-1); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 0 12px; gap: 4px; z-index: 4;
}
.rail__mark {
  width: 30px; height: 30px; border-radius: 8px; margin-bottom: 10px;
  display: grid; place-items: center; background: var(--s-3);
  border: 1px solid var(--ring); flex: none;
}
.rail__mark svg { display: block; }
.rbtn {
  width: 36px; height: 36px; border-radius: var(--r-md);
  display: grid; place-items: center; color: var(--ink-3);
  position: relative; flex: none;
}
.rbtn:hover { background: var(--s-3); color: var(--ink-1); }
.rbtn[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
.rbtn[aria-pressed="true"]::before {
  content:""; position:absolute; inset-inline-start:-10px; top:9px;
  width:2px; height:18px; background: var(--accent); border-radius:2px;
}
.rail__spacer { flex: 1; }
.rbtn__dot {
  position:absolute; top:6px; inset-inline-end:6px; width:6px; height:6px;
  border-radius:50%; background: var(--signal);
}

/* --------------------------- THREADS -------------------------------- */
.threads {
  background: var(--s-1); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
#app[data-threads="off"] .threads { border-right: 0; }
.threads__head { padding: 12px 12px 8px; display: grid; gap: 8px; }
.threads__title {
  font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--ink-3); font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
}
.newbtn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: var(--r-md);
  background: var(--s-3); border: 1px solid var(--ring);
  color: var(--ink-1); font-weight: 500; font-size: 13px;
}
.newbtn:hover { background: var(--accent-dim); border-color: var(--accent); }
.newbtn kbd { margin-inline-start: auto; }
kbd {
  font-family: var(--mono); font-size: 10px; color: var(--ink-3);
  border: 1px solid var(--line-2); border-radius: 4px; padding: 1px 4px;
  background: var(--s-1);
}
.search {
  display: flex; align-items: center; gap: 7px; padding: 7px 9px;
  background: var(--s-0); border: 1px solid var(--line); border-radius: var(--r-md);
}
.search input { flex: 1; background: none; border: 0; outline: 0; font-size: 13px; min-width: 0; }
.search input::placeholder { color: var(--ink-4); }
.threads__list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.threads__group {
  font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-4); padding: 12px 6px 5px; font-weight: 600;
}
.thread {
  display: block; width: 100%; text-align: start; padding: 7px 9px;
  border-radius: var(--r-md); color: var(--ink-2); font-size: 13px;
  border: 1px solid transparent; position: relative;
}
.thread:hover { background: var(--s-2); color: var(--ink-1); }
.thread[aria-current="true"] { background: var(--s-3); color: var(--ink-1); border-color: var(--ring); }
.thread__t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.thread__m {
  display: flex; gap: 8px; align-items: center; margin-top: 3px;
  font-family: var(--mono); font-size: 10px; color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.thread__tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }

.tag {
  font-family: var(--mono); font-size: 10px; padding: 1px 5px;
  border-radius: 3px; background: var(--s-3); color: var(--ink-3);
  border: 1px solid var(--line); white-space: nowrap;
}
.tag--live { background: var(--signal-dim); color: var(--signal); border-color: transparent; }

/* ---------------------------- STAGE --------------------------------- */
.stage { display: flex; flex-direction: column; min-width: 0; background: var(--s-0); position: relative; }

.topbar {
  height: 46px; flex: none; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--s-0) 88%, transparent);
  backdrop-filter: blur(12px); z-index: 3;
}
.topbar__title { font-weight: 550; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar__spacer { flex: 1; }
.iconbtn {
  width: 30px; height: 30px; border-radius: var(--r-sm); display: grid;
  place-items: center; color: var(--ink-3);
}
.iconbtn:hover { background: var(--s-3); color: var(--ink-1); }

/* live mesh pill — the thing no other chat UI can show */
.meshpill {
  display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 9px;
  border-radius: 20px; background: var(--s-1); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.meshpill b { color: var(--signal); font-weight: 600; }
.pulse {
  width: 7px; height: 7px; border-radius: 50%; background: var(--signal);
  box-shadow: 0 0 0 0 var(--signal-dim); animation: pulse 2.4s infinite;
}
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(46,230,192,.45); }
  70%  { box-shadow: 0 0 0 7px rgba(46,230,192,0); }
  100% { box-shadow: 0 0 0 0 rgba(46,230,192,0); }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }

/* --------------------------- STREAM --------------------------------- */
.stream { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.stream__inner { max-width: 860px; margin: 0 auto; padding: 22px 22px 140px; display: grid; gap: 22px; }

/* Turn = a labelled record, not a chat bubble. */
.turn { display: grid; gap: 9px; }
.turn__head {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-size: 10.5px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--ink-4);
}
.turn__head::after { content:""; flex:1; height:1px; background: var(--line); }
.turn__who { color: var(--ink-3); font-weight: 600; }
.turn--user .turn__who { color: var(--accent); }

.usertext {
  font-size: 15px; line-height: 1.6; color: var(--ink-1);
  border-inline-start: 2px solid var(--accent); padding-inline-start: 12px;
  white-space: pre-wrap; overflow-wrap: anywhere;
}

/* ---- reasoning pipeline strip (live) ---- */
.pipe {
  display: flex; align-items: stretch; gap: 0; flex-wrap: wrap;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--s-1); overflow: hidden;
}
.pipe__step {
  display: flex; align-items: center; gap: 7px; padding: 7px 11px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-4);
  border-inline-end: 1px solid var(--line); position: relative;
  font-variant-numeric: tabular-nums;
}
.pipe__step:last-child { border-inline-end: 0; }
.pipe__step[data-state="run"] { color: var(--signal); }
.pipe__step[data-state="done"]{ color: var(--ink-2); }
.pipe__step[data-state="skip"]{ opacity: .4; }
.pipe__dot { width:6px; height:6px; border-radius:50%; background: currentColor; flex:none; }
.pipe__step[data-state="run"] .pipe__dot { animation: pulse 1.4s infinite; }
.pipe__ms { color: var(--ink-4); }
.pipe__spacer { flex:1; }
.pipe__toggle { padding: 7px 11px; font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.pipe__toggle:hover { color: var(--ink-1); background: var(--s-3); }

.trace {
  border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--r-md) var(--r-md);
  background: var(--s-1); padding: 11px 13px; display: grid; gap: 9px;
  font-size: 12.5px; color: var(--ink-2);
}
.trace__k {
  font-family: var(--mono); font-size: 10px; letter-spacing:.06em; text-transform: uppercase;
  color: var(--ink-4); margin-bottom: 3px;
}
.trace ol { padding-inline-start: 18px; display: grid; gap: 3px; }

/* ---- answer body ---- */
.answer { font-size: 15px; line-height: 1.68; color: var(--ink-1); overflow-wrap: anywhere; }
.answer > * + * { margin-top: 13px; }
.answer h1,.answer h2,.answer h3 { line-height:1.3; font-weight:600; letter-spacing:-.01em; }
.answer h1 { font-size: 20px; margin-top: 22px; }
.answer h2 { font-size: 17px; margin-top: 20px; }
.answer h3 { font-size: 15px; margin-top: 16px; color: var(--ink-2); }
.answer ul,.answer ol { padding-inline-start: 22px; display: grid; gap: 5px; }
.answer li::marker { color: var(--ink-4); }
.answer strong { font-weight: 640; }
.answer a { color: var(--accent); text-underline-offset: 2px; }
.answer blockquote {
  border-inline-start: 2px solid var(--line-2); padding-inline-start: 13px; color: var(--ink-2);
}
.answer code {
  font-family: var(--mono); font-size: 12.5px; background: var(--s-2);
  padding: 1.5px 5px; border-radius: 4px; border: 1px solid var(--line);
}
.answer pre {
  background: var(--s-1); border: 1px solid var(--line); border-radius: var(--r-md);
  padding: 12px 14px; overflow-x: auto;
}
.answer pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.6; }
.answer table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.answer th, .answer td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: start; }
.answer th { color: var(--ink-3); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
.answer td.num, .answer th.num { text-align: end; }

.cursor {
  display: inline-block; width: 7px; height: 15px; vertical-align: -2px;
  background: var(--signal); animation: blink 1.05s steps(2) infinite; margin-inline-start: 2px;
}
@keyframes blink { 0%,50%{opacity:1} 51%,100%{opacity:0} }

/* ---- claim grounding underline ---- */
.claim { border-bottom: 1px dashed var(--line-2); cursor: help; }
.claim[data-grounded="web"]    { border-bottom-color: var(--series-3); }
.claim[data-grounded="memory"] { border-bottom-color: var(--series-7, var(--series-5)); }
.claim[data-grounded="model"]  { border-bottom-color: var(--warn); }

/* ---- provenance footer on every assistant turn ---- */
.prov {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding-top: 9px; border-top: 1px solid var(--line);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
  border-radius: 4px; background: var(--s-1); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.chip b { color: var(--ink-1); font-weight: 600; }
.chip--good { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.chip--warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.chip--mesh { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 35%, var(--line)); }
.chip--act:hover { background: var(--s-3); color: var(--ink-1); cursor: pointer; }
.prov__spacer { flex: 1; }

/* ---- citations ---- */
.cites { display: grid; gap: 6px; }
.cite {
  display: flex; gap: 9px; align-items: baseline; padding: 7px 10px;
  background: var(--s-1); border: 1px solid var(--line); border-radius: var(--r-md);
  font-size: 12.5px; color: var(--ink-2); text-decoration: none;
}
.cite:hover { border-color: var(--accent); }
.cite__n {
  font-family: var(--mono); font-size: 10px; color: var(--ink-4); flex: none;
  min-width: 16px;
}
.cite__t { color: var(--ink-1); font-weight: 500; }
.cite__d { color: var(--ink-4); font-family: var(--mono); font-size: 10.5px; }

/* --------------------------- COMPOSER ------------------------------- */
.composer-wrap {
  position: absolute; inset-inline: 0; bottom: 0; padding: 0 22px 18px;
  background: linear-gradient(to top, var(--s-0) 62%, transparent);
  pointer-events: none;
}
.composer {
  max-width: 860px; margin: 0 auto; pointer-events: auto;
  background: var(--s-1); border: 1px solid var(--line-2); border-radius: var(--r-lg);
  box-shadow: 0 8px 32px rgba(0,0,0,.36);
}
.composer:focus-within { border-color: var(--accent); }
.composer__modes {
  display: flex; align-items: center; gap: 2px; padding: 7px 8px 0;
}
.mode {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 6px; font-size: 12px; color: var(--ink-3); font-weight: 500;
}
.mode:hover { background: var(--s-3); color: var(--ink-1); }
.mode[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
.composer__modes .composer__spacer { flex: 1; }
.composer__body { display: flex; align-items: flex-end; gap: 8px; padding: 6px 10px 10px; }
.composer textarea {
  flex: 1; background: none; border: 0; outline: 0; resize: none;
  font-size: 15px; line-height: 1.55; max-height: 220px; min-height: 26px; padding: 4px 2px;
}
.composer textarea::placeholder { color: var(--ink-4); }
.sendbtn {
  width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center;
  background: var(--accent); color: #fff; flex: none;
}
.sendbtn:disabled { background: var(--s-3); color: var(--ink-4); cursor: not-allowed; }
.composer__hint {
  display: flex; align-items: center; gap: 10px; padding: 0 12px 9px;
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-4);
}
.composer__hint .composer__spacer { flex: 1; }

/* --------------------------- CANVAS --------------------------------- */
.canvas {
  background: var(--s-1); border-inline-start: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0; overflow: hidden;
}
#app[data-canvas="off"] .canvas { border-inline-start: 0; }
.canvas__tabs {
  display: flex; height: 46px; flex: none; border-bottom: 1px solid var(--line); padding: 0 6px;
  align-items: center; gap: 2px;
}
.ctab {
  height: 28px; padding: 0 10px; border-radius: 6px; font-size: 12px;
  color: var(--ink-3); font-weight: 500; display: inline-flex; align-items: center; gap: 6px;
}
.ctab:hover { background: var(--s-3); color: var(--ink-1); }
.ctab[aria-selected="true"] { background: var(--s-3); color: var(--ink-1); }
.ctab__n {
  font-family: var(--mono); font-size: 9.5px; background: var(--s-0);
  border-radius: 3px; padding: 0 4px; color: var(--ink-4);
}
.canvas__body { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 14px; align-content: start; }
.canvas__pane[hidden] { display: none; }

.empty {
  display: grid; gap: 7px; place-items: center; text-align: center;
  padding: 44px 18px; color: var(--ink-4); font-size: 12.5px;
}
.empty svg { opacity: .5; }

/* ---- card ---- */
.card {
  background: var(--s-0); border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden;
}
.card__head {
  display: flex; align-items: center; gap: 8px; padding: 9px 11px;
  border-bottom: 1px solid var(--line);
}
.card__title { font-size: 12px; font-weight: 600; color: var(--ink-1); }
.card__sub { font-family: var(--mono); font-size: 10px; color: var(--ink-4); }
.card__spacer { flex: 1; }
.card__body { padding: 11px; }

/* ---- stat tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px,1fr)); gap: 1px; background: var(--line); }
.tile { background: var(--s-0); padding: 10px 11px; display: grid; gap: 2px; }
.tile__k { font-size: 10.5px; color: var(--ink-3); letter-spacing:.03em; }
.tile__v { font-size: 21px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; }
.tile__d { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); font-variant-numeric: tabular-nums; }
.tile__d[data-dir="up"]   { color: var(--ok); }
.tile__d[data-dir="down"] { color: var(--critical); }

/* ---- charts ---- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { font-family: var(--sans); fill: var(--ink-3); font-size: 10px; }
.chart .grid { stroke: var(--line); stroke-width: 1; shape-rendering: crispEdges; }
.chart .axis { stroke: var(--line-2); stroke-width: 1; shape-rendering: crispEdges; }
.chart .lbl  { fill: var(--ink-3); font-size: 10px; }
.chart .val  { fill: var(--ink-2); font-size: 10px; font-variant-numeric: tabular-nums; }
.chart .hit  { fill: transparent; cursor: pointer; }
.chart .hit:hover + .mark, .chart .mark.on { stroke: var(--s-0); stroke-width: 2; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 13px; padding: 9px 11px 0; }
.legend__i { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); cursor: pointer; }
.legend__i[aria-pressed="false"] { opacity: .38; }
.legend__note { font-size: 10.5px; color: var(--ink-4); font-family: var(--mono); }
.legend__s { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.tt {
  position: fixed; z-index: 60; pointer-events: none; opacity: 0;
  background: var(--s-2); border: 1px solid var(--line-2); border-radius: 6px;
  padding: 7px 9px; font-size: 11.5px; color: var(--ink-1);
  box-shadow: 0 6px 20px rgba(0,0,0,.45); transition: opacity .1s; max-width: 240px;
  font-variant-numeric: tabular-nums;
}
.tt[data-on="1"] { opacity: 1; }
.tt__k { color: var(--ink-3); font-size: 10px; text-transform: uppercase; letter-spacing:.05em; }
.tt__r { display: flex; gap: 10px; align-items: center; justify-content: space-between; }

/* inline chart inside the answer stream */
.figure { border: 1px solid var(--line); border-radius: var(--r-md); background: var(--s-1); overflow: hidden; }
.figure__cap {
  display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 0; flex-wrap: wrap;
}
.figure__t { font-size: 13px; font-weight: 600; }
.figure__s { font-size: 11.5px; color: var(--ink-3); }
.figure__actions { margin-inline-start: auto; display: flex; gap: 2px; }
.figure__body { padding: 6px 12px 12px; }
.tablebtn { font-family: var(--mono); font-size: 10px; color: var(--ink-4); padding: 2px 6px; border-radius: 4px; }
.tablebtn:hover { background: var(--s-3); color: var(--ink-1); }

/* ---- knowledge graph ---- */
.graphwrap { position: relative; background: var(--s-0); border: 1px solid var(--line); border-radius: var(--r-md); }
/* explicit CSS height: the sim rewrites canvas.height for DPR, which would
   otherwise collapse the intrinsic layout height to zero on the next frame */
#graph { display: block; width: 100%; height: 300px; border-radius: var(--r-md) var(--r-md) 0 0; }
.graph__ctl { position: absolute; top: 8px; inset-inline-end: 8px; display: flex; gap: 3px; z-index: 2; }
.graph__ctl .tablebtn { background: var(--s-1); border: 1px solid var(--line); }
.graph__legend { padding: 9px 11px; display: flex; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); }

.note {
  border: 1px solid var(--line); border-radius: var(--r-md); background: var(--s-0);
  padding: 10px 11px; display: grid; gap: 6px;
}
.note__t { font-size: 12.5px; font-weight: 600; }
.note__x { font-size: 12px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note__f { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.wikilink { color: var(--accent); cursor: pointer; text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
.wikilink:hover { border-bottom-color: var(--accent); }
.wikilink--new { color: var(--ink-4); border-bottom-style: dashed; }

/* ---- toasts ---- */
.toasts { position: fixed; bottom: 18px; inset-inline-end: 18px; display: grid; gap: 8px; z-index: 80; }
.toast {
  background: var(--s-2); border: 1px solid var(--line-2); border-radius: var(--r-md);
  padding: 10px 13px; font-size: 12.5px; box-shadow: 0 8px 26px rgba(0,0,0,.42);
  display: flex; gap: 9px; align-items: center; max-width: 340px;
  animation: rise .2s cubic-bezier(.4,0,.2,1);
}
@keyframes rise { from { opacity:0; transform: translateY(8px); } }
.toast--err { border-inline-start: 2px solid var(--critical); }
.toast--ok  { border-inline-start: 2px solid var(--ok); }

/* ---- command palette ---- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 70; display: grid; place-items: start center; padding-top: 12vh; }
.scrim[hidden] { display: none; }
.palette {
  width: min(560px, 92vw); background: var(--s-1); border: 1px solid var(--line-2);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.palette__in { width: 100%; padding: 14px 16px; background: none; border: 0; outline: 0; font-size: 15px; border-bottom: 1px solid var(--line); }
.palette__list { max-height: 320px; overflow-y: auto; padding: 6px; }
.pitem { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border-radius: var(--r-md); text-align: start; font-size: 13px; color: var(--ink-2); }
.pitem:hover, .pitem[data-sel="1"] { background: var(--s-3); color: var(--ink-1); }
.pitem__k { margin-inline-start: auto; }

/* ---- responsive ---- */
@media (max-width: 1180px) {
  #app { grid-template-columns: var(--rail) var(--threads) minmax(0,1fr) 0; }
  #app[data-canvas="on"] { grid-template-columns: var(--rail) 0 minmax(0,1fr) var(--canvas); }
}
/* Below 780px the side panes become overlays rather than grid columns —
   as columns they starved the conversation of width and could hide it
   entirely when both were open. */
@media (max-width: 780px) {
  /* [data-threads][data-canvas] matches the two-attribute base rules
     (#app[data-threads="off"][data-canvas="off"]) on specificity and wins on
     source order. Without it the desktop 4-column template survives here and
     the conversation lands in a 0px column. */
  #app, #app[data-threads][data-canvas] {
    grid-template-columns: var(--rail) minmax(0,1fr);
  }
  .threads, .canvas {
    position: fixed; top: 0; bottom: 0; z-index: 30;
    width: min(340px, calc(100vw - var(--rail)));
    box-shadow: 0 0 46px rgba(0,0,0,.55);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
  }
  .threads { left: var(--rail); transform: translateX(calc(-100% - var(--rail))); }
  .canvas  { right: 0; transform: translateX(100%); border-inline-start: 1px solid var(--line); }
  #app[data-threads="on"] .threads { transform: none; }
  #app[data-canvas="on"]  .canvas  { transform: none; }
  .stream__inner { padding: 16px 14px 156px; }
  .composer-wrap { padding: 0 12px 12px; }
  .topbar { padding: 0 8px; gap: 6px; }
  .meshpill { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
@media (forced-colors: active) {
  .chip, .card, .figure, .composer { border: 1px solid CanvasText; }
}

/* --- scroll containers --------------------------------------------------
   A flex/grid item's min-height defaults to auto (its content height), so
   overflow-y:auto never engages: the box grows to fit the content instead of
   scrolling, .stage outgrows its grid row, #app outgrows the viewport and the
   topbar/rail scroll off-screen. Vertical twin of the min-width:0 guards.
   ---------------------------------------------------------------------- */
.stage,
.stream,
.threads,
.threads__list,
.canvas,
.canvas__body { min-height: 0; }
</style>
</head>
<body>
<div id="app" data-threads="on" data-canvas="on"><!-- shell injected below --></div>
<div class="toasts" id="toasts"></div>
<div class="tt" id="tt"></div>
<div class="scrim" id="scrim" hidden>
  <div class="palette" role="dialog" aria-label="Command palette">
    <input class="palette__in" id="paletteIn" placeholder="Search threads, notes, commands…" autocomplete="off" />
    <div class="palette__list" id="paletteList"></div>
  </div>
</div>


<script type="module" src="/js/console/99-entry.js"></script>
</body>
</html>
