<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NeuralMesh Beta</title>
  <script>window.NM_CONFIG = { apiBase: "__NM_API_BASE__", supabaseUrl: "__NM_SUPABASE_URL__", supabaseAnonKey: "__NM_SUPABASE_ANON_KEY__" };</script>
  <style>
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(circle at top, rgba(139,92,246,.28), transparent 28rem), #05050a; color: #f8fafc; }
    nav, main { width: min(440px, calc(100% - 40px)); margin: 0 auto; }
    nav { display: flex; justify-content: space-between; gap: 18px; padding: 24px 0; }
    .links { display: flex; gap: 18px; }
    main { margin-top: 4vh; border: 1px solid #292940; background: rgba(16,16,27,.82); border-radius: 20px; padding: 24px; }
    a { color: #c4b5fd; text-decoration: none; }
    h1 { margin: 0 0 8px; font-size: clamp(22px, 3.5vw, 28px); letter-spacing: -.04em; line-height: 1.1; }
    p { color: #a1a1aa; line-height: 1.5; font-size: 14px; margin: 0 0 4px; }
    label { display: block; margin-top: 14px; color: #e4e4e7; font-size: 13px; font-weight: 700; }
    input { width: 100%; margin-top: 6px; border: 1px solid #292940; border-radius: 10px; padding: 10px 12px; background: rgba(5,5,10,.72); color: #f8fafc; font: inherit; }
    button { width: 100%; margin-top: 14px; border: 0; border-radius: 999px; padding: 11px 16px; background: #8b5cf6; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: transparent; border: 1px solid #292940; color: #c4b5fd; }
    #message { min-height: 24px; font-size: 14px; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="brand" aria-label="MeshNet home"><img src="https://meshnet.co/logo-new.png?v=2" alt="MeshNet" style="height:32px;width:auto;display:block;"></a>
    <div class="links">
      <a href="/pricing.html">Pricing</a>
      <a href="/login.html">Login</a>
      <a href="/terms.html">Terms</a>
      <a href="/privacy.html">Privacy</a>
    </div>
  </nav>
  <main>
    <form id="login-form">
      <h1>Log in</h1>
      <p>Use password login or request a Supabase magic link.</p>
      <label>Email<input name="email" type="email" required></label>
      <label>Password<input name="password" type="password"></label>
      <button type="submit">Log in with password</button>
      <button id="magic-link" class="secondary" type="button">Email me a magic link</button>
      <p id="message"></p>
      <p><a href="/signup.html">Need an account? Sign up with an invite.</a></p>
    </form>
  </main>
  <script>
    const form = document.getElementById("login-form");
    const message = document.getElementById("message");
    async function submitLogin(magicLink) {
      const payload = Object.fromEntries(new FormData(form).entries());
      payload.magic_link = magicLink;
      if (magicLink) delete payload.password;
      const response = await fetch("/api/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(payload),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        message.style.color = "#fca5a5";
        message.textContent = data.detail || "Login failed";
        return;
      }
      if (magicLink) {
        message.style.color = "#86efac";
        message.textContent = data.message;
        return;
      }
      sessionStorage.setItem("nm_email", payload.email); var __i=localStorage.getItem("nm_intent"); window.location.href = __i==="provider" ? "/host-dashboard.html" : "/chat.html";
    }
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      submitLogin(false);
    });
    document.getElementById("magic-link").addEventListener("click", () => submitLogin(true));
  </script>
<style>
  .site-footer{border-top:1px solid rgba(255,255,255,0.08);margin-top:64px;padding:32px 24px;color:#a1a1aa;font-size:14px}
  .site-footer .footer-inner{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}

  .site-footer .footer-brand img{height:28px;width:auto;display:block}

  .site-footer .footer-links{display:flex;flex-wrap:wrap;gap:20px}
  .site-footer .footer-links a{color:#a78bfa;text-decoration:none}
  .site-footer .footer-links a:hover{text-decoration:underline}
  .site-footer .footer-copy{width:100%;text-align:center;margin-top:16px;color:#71717a;font-size:13px}
  @media (max-width:560px){.site-footer .footer-inner{flex-direction:column;align-items:flex-start}}
</style>

      <a href="/privacy.html">Privacy Policy</a>
    </div>
    <div class="footer-copy">© 2026 MeshNet Inc. All rights reserved.</div>
  </div>
</footer>
</body>
</html>
